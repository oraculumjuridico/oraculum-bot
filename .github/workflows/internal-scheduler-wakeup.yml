name: Acordar agendador interno

on:
  schedule:
    # As consultas do bot ocorrem entre 08h e 19h. A janela adicional inicia
    # às 06h para cobrir os lembretes de uma hora das primeiras consultas.
    # Vinte minutos preserva a tolerância de 30 minutos dos lembretes e deixa
    # Render e Neon suspenderem entre execuções.
    - cron: "*/20 6-19 * * *"
      timezone: "America/Fortaleza"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: internal-scheduler-wakeup
  cancel-in-progress: false

jobs:
  wakeup:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Chamar Oraculum com identidade GitHub
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('oraculum-internal-scheduler')
            const response = await fetch('https://oraculum-bot.onrender.com/internal/processar-agendamentos-github', {
              method: 'POST',
              headers: {
                authorization: `Bearer ${token}`,
                'content-type': 'application/json'
              },
              body: '{}'
            })
            const body = await response.text()
            core.info(`HTTP ${response.status}: ${body.slice(0, 500)}`)
            if (!response.ok) core.setFailed(`Agendador respondeu HTTP ${response.status}`)
            let parsed = null
            try { parsed = JSON.parse(body) } catch {}
            if (response.ok && parsed?.status !== 'ok') {
              core.setFailed(`Agendador não confirmou execução: ${parsed?.status || 'resposta inválida'}`)
            }
