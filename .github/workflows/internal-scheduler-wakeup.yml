name: Acordar agendador interno

on:
  schedule:
    # GitHub cron usa UTC. Estas duas faixas correspondem a 06h07-21h47 em
    # Fortaleza. Os minutos 07/27/47 evitam a maior carga do início da hora.
    # A cadência de vinte minutos preserva a tolerância dos lembretes e deixa
    # Render e Neon suspenderem entre as execuções.
    - cron: "7,27,47 9-23 * * *"
    - cron: "7,27,47 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: internal-scheduler-wakeup
  cancel-in-progress: false

jobs:
  wakeup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Chamar Oraculum com identidade GitHub
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('oraculum-internal-scheduler')
            const response = await fetch('https://oraculum-bot.onrender.com/internal/processar-agendamentos-github', {
              method: 'POST',
              headers: {
                authorization: `Bearer ${token}`,
                'content-type': 'application/json'
              },
              body: '{}'
            })
            const body = await response.text()
            core.info(`HTTP ${response.status}: ${body.slice(0, 500)}`)
            if (!response.ok) core.setFailed(`Agendador respondeu HTTP ${response.status}`)
            let parsed = null
            try { parsed = JSON.parse(body) } catch {}
            if (response.ok && parsed?.status !== 'ok') {
              core.setFailed(`Agendador não confirmou execução: ${parsed?.status || 'resposta inválida'}`)
            }
